<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEL SONG CONTEST 2032</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--pill:#fff;--pillfg:#000;--mut:#9a9a9a;--line:#2a2a2a;--row:#0d0d0d;--a1:#b9a8ea;--a2:#e9a9c4;--a3:#f2d3ad;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.hero{background:linear-gradient(90deg,#000 68%,#fff 68%);padding:48px 0 40px;overflow:hidden}
.hero h1{margin:0;font-weight:500;font-size:clamp(22px,8.2vw,92px);line-height:1;letter-spacing:.01em;white-space:nowrap;color:#fff;mix-blend-mode:difference}
.hero p{margin:14px 0 0;letter-spacing:.22em;font-size:clamp(11px,1.6vw,17px);color:#fff;mix-blend-mode:difference}
.hero b{font-weight:700}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 6px}
nav a{padding:8px 18px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:14px}
nav a[aria-current=page]{background:var(--pill);color:var(--pillfg);border-color:var(--pill)}
nav a:hover{border-color:#fff}
h2{font-weight:600;font-size:clamp(22px,3vw,30px);margin:44px 0 18px;letter-spacing:.02em}
.pills{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--pill);color:var(--pillfg);border-radius:28px;padding:6px 16px 6px 8px;font-weight:700;font-size:15px;text-transform:uppercase;transition:transform .15s;height:100%}
.pill:hover{transform:scale(1.05)}
.pill em{display:block;font-style:normal;font-weight:500;font-size:11px;letter-spacing:.03em;line-height:1.3;text-transform:none;color:#333;max-width:230px}
.fl{flex:none;font-size:15px;line-height:1;width:30px;height:26px;display:grid;place-items:center;background:#000;border-radius:50%/45% 45% 55% 55%}
.feat{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;margin-top:40px}
.feat h2{margin:0 0 14px;font-size:clamp(28px,4.4vw,52px);line-height:1.1;font-weight:700}
.feat p{margin:0 0 14px;color:#d8d8d8;max-width:60ch}
.feat .tag{display:inline-block;background:#fff;color:#000;border-radius:99px;padding:4px 14px;font-weight:700;font-size:13px;margin-bottom:16px}
.ph{aspect-ratio:4/5;width:100%;border-radius:20px;background:#111;border:1px dashed #444;display:grid;place-items:center;text-align:center;color:#666;font-weight:700;font-size:44px;overflow:hidden}
.ph small{display:block;font-size:12px;font-weight:500;margin-top:4px}
.ph.wide{aspect-ratio:1170/821}
.ph img{width:100%;height:100%;object-fit:cover;object-position:52% 50%;display:block}
.winners{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 22px;margin-top:8px}
.win{display:flex;flex-direction:column}
.win .ph{font-size:34px;margin-bottom:12px}
.win .yr{font-size:44px;font-weight:700;line-height:1;margin:0 0 4px}
.win h3{margin:0;font-size:19px;font-weight:700;text-transform:uppercase;line-height:1.2}
.win .song{margin:2px 0 8px;color:#d8d8d8;font-size:15px}
.win .meta{margin-top:auto;display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--mut)}
.win a.meta:hover{color:#fff}
.win.tbd .ph{border-color:#777;color:#aaa}
.win.tbd h3,.win.tbd .song{color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;margin-top:8px}
.tbl th,.tbl td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}
.tbl th{font-weight:600;font-size:14px;color:var(--mut)}
.tbl td.e{color:#555}
.tbl tr.now td{background:var(--row)}
.scroll{overflow-x:auto}
.empty{color:var(--mut);border:1px dashed var(--line);border-radius:16px;padding:22px}
.back{display:inline-block;margin:26px 0 0;color:var(--mut);font-weight:600}
.back:hover{color:#fff}
.ch{display:flex;align-items:center;gap:18px;margin-top:10px}
.ch .fl{width:64px;height:56px;font-size:34px;background:#111}
.ch h1{margin:0;font-size:clamp(30px,6vw,64px);font-weight:600;text-transform:uppercase;line-height:1.1}
.news{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:32px;align-items:center;border:1px solid var(--line);border-radius:24px;padding:20px}
.news .ph{aspect-ratio:4/3}
.news h3,.org h3{margin:0 0 10px;font-size:clamp(20px,2.6vw,28px);line-height:1.2}
.news p,.org p{margin:0 0 14px;color:#d8d8d8;max-width:62ch}
.org{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:36px;align-items:center}
.org .ph{aspect-ratio:3/4}
.stats{display:flex;gap:12px 36px;flex-wrap:wrap;margin:22px 0 6px}
.stats b{display:block;font-size:32px;font-weight:700;line-height:1.1}
.stats span{color:var(--mut);font-size:13px;font-weight:600}
.osub{color:var(--mut);margin:-8px 0 22px;max-width:70ch;font-size:14px}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.pc{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:22px;padding:18px 20px;position:relative;overflow:hidden;background:linear-gradient(160deg,#141414,#050505)}
.pc.first{background:#fff;color:#000;border-color:#fff}
.pc .n{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--mut)}
.pc.first .n,.pc.first em{color:#444}
.pc b.nm{font-size:20px;text-transform:uppercase;line-height:1.2;margin-top:6px}
.pc em{font-style:normal;color:#bbb;font-size:13px}
.pc .big{font-size:clamp(40px,6vw,64px);font-weight:700;line-height:1;margin-top:14px;letter-spacing:-.02em}
.pc .o{margin-top:8px;font-weight:600;font-size:13px;display:inline-block;border:1px solid currentColor;border-radius:99px;padding:3px 12px;align-self:flex-start}
.tools{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.tools button{font:inherit;font-weight:600;font-size:13px;padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:none;color:#fff;cursor:pointer}
.tools button[aria-pressed=true]{background:#fff;color:#000;border-color:#fff}
.tools .bt{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--mut)}
.tools .bt:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff2d2d;margin-right:8px;box-shadow:0 0 10px #ff2d2d;animation:live 1.4s ease-in-out infinite}
@keyframes live{50%{opacity:.3}}
.ohead,.orow{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(150px,230px) 92px;gap:14px;align-items:center;padding:12px 14px}
.ohead{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.ohead span:last-child,.orow .od{text-align:right}
.orow{border-bottom:1px solid #181818;border-radius:14px;transition:background .15s}
.orow:hover{background:#121212}
.rk{font-weight:700;color:var(--mut);font-size:15px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;text-transform:uppercase;font-size:15px}
.who em{display:block;font-style:normal;color:#aaa;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chance{position:relative;height:30px;border-radius:99px;background:#111;overflow:hidden;display:flex;align-items:center}
.chance i{position:absolute;left:0;top:0;bottom:0;background:#fff;color:#000;font-style:normal;font-weight:700;font-size:13px;display:flex;align-items:center;padding-left:14px;border-radius:99px;white-space:nowrap}
.chance b{position:relative;margin-left:12px;font-size:13px;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000}
.od{font-weight:700;font-size:16px;background:#fff;color:#000;border-radius:10px;padding:5px 0;text-align:center!important}
@media (max-width:760px){.pod{grid-template-columns:1fr}.ohead span:nth-child(3){display:none}.ohead,.orow{grid-template-columns:30px minmax(0,1fr) 70px}.orow .chance{grid-column:2/4;grid-row:2}}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.rc{border:1px solid var(--line);border-radius:22px;padding:18px;background:linear-gradient(160deg,#16101f,#050505);display:flex;flex-direction:column;gap:4px}
.rc small{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--a3);text-transform:uppercase}
.rc b{font-size:20px;text-transform:uppercase;line-height:1.2}
.rc .v{font-size:38px;font-weight:700;line-height:1;background:linear-gradient(90deg,var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:6px}
.rc em{font-style:normal;font-size:12px;color:#aaa}
.br{display:grid;grid-template-columns:minmax(110px,170px) 1fr 64px;gap:12px;align-items:center;padding:5px 0}
.br span{font-weight:700;font-size:13px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .t{height:24px;border-radius:99px;background:#111;overflow:hidden}
.br i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.br.top i{background:linear-gradient(90deg,var(--a2),var(--a3))}
.br b{text-align:right;font-size:14px}
.hm{border-collapse:separate;border-spacing:3px;width:100%;min-width:520px}
.hm th{font-size:12px;color:var(--mut);font-weight:600;padding:4px}
.hm td.c{height:30px;text-align:center;font-size:12px;font-weight:700;border-radius:8px;min-width:56px}
.hm td.n{font-weight:700;font-size:13px;text-transform:uppercase;white-space:nowrap;padding-right:14px}
.hm td.n a:hover{color:var(--a3)}
.hm td.sf{border:1px dashed #333;color:#555}
.hm td.no{color:#333}
.leg{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);margin:0 0 12px}
.leg i{flex:0 1 220px;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--a3),hsl(335,38%,76%),hsl(335,38%,22%))}
.sel{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.sel select{font:inherit;font-weight:700;background:#111;color:#fff;border:1px solid #333;border-radius:14px;padding:10px 14px;text-transform:uppercase}
.sel span{color:var(--mut);font-weight:700}
.mr{display:grid;grid-template-columns:52px 1fr 120px 1fr 52px;gap:10px;align-items:center;margin:9px 0;text-align:center}
.mr span{font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.mr b{color:#777}.mr b.w{color:#fff}
.mb{height:16px;background:#111;border-radius:99px;overflow:hidden;display:flex}
.mb.l{justify-content:flex-end}
.mb i{display:block;height:100%;background:var(--a2);border-radius:99px}
.mb:not(.l) i{background:var(--a3)}
.ch2{width:100%;height:auto;margin-top:18px;border:1px solid var(--line);border-radius:20px;background:#070707}
@media (max-width:760px){.br{grid-template-columns:92px 1fr 48px}.mr{grid-template-columns:40px 1fr 78px 1fr 40px;gap:6px}}
.orow[data-r]{cursor:pointer}
.orow.out{opacity:.45}
.cut{margin:8px 0;padding:8px 14px;font-size:11px;letter-spacing:.14em;color:var(--mut);border-top:1px dashed #444;text-transform:uppercase}
.chance.sp i{position:static;background:var(--a1);width:auto;border-radius:0}
.chance.sp i+i{background:var(--a2)}
.chance.sp .in{position:absolute;left:0;top:0;bottom:0;display:flex;border-radius:99px;overflow:hidden}
.chance.sp i:first-child{background:linear-gradient(90deg,#8f7fc9,var(--a1))}
.dt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding:12px 14px 16px 58px;background:#0b0b0b;border-radius:0 0 14px 14px;margin-bottom:6px}
.dt[hidden]{display:none}
.dt div{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.dt small{display:block;font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;font-weight:700}
.dt b{font-size:17px}
.dt a{align-self:center;justify-self:start;border:0;padding:0;color:var(--a3);font-weight:700;font-size:13px}
.srch{font:inherit;background:#111;color:#fff;border:1px solid #333;border-radius:99px;padding:8px 18px;min-width:220px}
.srch::placeholder{color:#777}
.lg2{display:flex;gap:16px;font-size:12px;font-weight:700;margin:0 0 10px}
@media (max-width:760px){.dt{padding-left:14px}}
.cols{display:grid;gap:0 22px;align-items:start}
.cr{display:grid;grid-template-columns:34px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:8px 10px;border-radius:16px;background:#101010;margin-bottom:8px;cursor:pointer;transition:background .15s}
.cr:hover{background:#1a1a1a}
.cr.out{opacity:.45}
.cr .rk{text-align:center;background:#1a1a1a;border-radius:10px;padding:4px 0}
.cr .od{border-radius:10px;padding:4px 0;font-size:14px}
.cr .who{gap:10px}
.mini{display:flex;height:4px;border-radius:9px;overflow:hidden;background:#1d1d1d;margin-top:5px}
.col .dt{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px;margin:-4px 0 10px}
.pod.sm{gap:10px;margin-bottom:18px}
.pod.sm .pc{padding:14px 18px;border-radius:20px;gap:0}
.pod.sm .nm{margin:3px 0 0;font-size:17px}
.pod.sm .big{font-size:38px;margin-top:8px}
.ch3{font-size:11px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:var(--mut);margin:0 0 10px 4px}
.ch3.q{color:var(--a3)}
.rec.sm .rc{padding:12px 14px;border-radius:18px;gap:2px}
.rec.sm .v{font-size:26px;margin-top:2px}
.rec.sm .rc small{color:var(--mut)}
.rec.sm .rc .v{background:none;-webkit-text-fill-color:#fff;color:#fff}
.rec.sm .rc b{font-size:15px}
@media (max-width:900px){.cols{grid-template-columns:1fr!important}}
.vbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.vd{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:200px}
.vd i{width:13px;height:13px;border-radius:50%;border:1px solid #444;transition:background .2s}
.vd i.on{background:#4cd68a;border-color:transparent;box-shadow:0 0 8px rgba(76,214,138,.5)}
.vbar>b{font-size:15px;white-space:nowrap}
.btn{font:inherit;font-weight:700;font-size:13px;padding:8px 18px;border-radius:99px;border:1px solid #333;background:none;color:#fff;cursor:pointer}
.btn:hover:not(:disabled){border-color:#fff}
.btn.pri{background:#fff;color:#000;border-color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.vc{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:#101010;border:1px solid transparent;transition:border-color .2s,background .2s}
.vc.on{border-color:#e3dbfa;background:#15121d}
.vi b{display:block;text-transform:uppercase;font-size:14px}
.vi em{display:block;font-style:normal;font-size:12px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vb{display:block;height:4px;border-radius:9px;background:#1d1d1d;margin-top:6px;overflow:hidden}
.vb i{display:block;height:100%;background:linear-gradient(90deg,#e3dbfa,#fad9e8);transition:width .25s}
.vs{display:flex;align-items:center;gap:8px}
.vs button{width:32px;height:32px;border-radius:50%;border:1px solid #333;background:none;color:#fff;font:inherit;font-size:18px;line-height:1;cursor:pointer}
.vs button:hover:not(:disabled){background:#fff;color:#000}
.vs button:disabled{opacity:.3;cursor:default}
.vs b{min-width:22px;text-align:center;font-size:18px}
.vsum{max-width:620px}
.vsum .cr{cursor:default}
.vnote{color:var(--mut);font-size:13px;margin:14px 0 0}
.method{border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-top:16px;background:#0b0b0b}
.method summary{cursor:pointer;font-weight:700}
.method p{color:#d0d0d0;font-size:14px;max-width:80ch;margin:10px 0 0}
.mt{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;align-items:start}
.mt-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.mt-h h3{margin:0;font-size:20px}.mt-h span{color:var(--mut);font-size:13px;font-weight:600}
.mt-list{display:flex;flex-direction:column;gap:6px;min-height:90px;border:1px dashed #333;border-radius:20px;padding:10px}
.mt-pool{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:640px;overflow:auto;padding-right:4px}
.mt-rank,.mt-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:#111;cursor:grab;transition:box-shadow .1s}
.mt-rank .rk{min-width:32px;text-align:center;background:#1c1c1c;border-radius:10px;padding:4px 0;font-weight:700}
.mt-rank:nth-child(1) .rk{background:#f2d3ad;color:#000}.mt-rank:nth-child(2) .rk{background:#d9d9e3;color:#000}.mt-rank:nth-child(3) .rk{background:#e8b49a;color:#000}
.mt-rank.ot{box-shadow:0 -3px 0 #ae97f2}.mt-rank.ob{box-shadow:0 3px 0 #ae97f2}
.mt-t{flex:1;min-width:0}.mt-t b{display:block;text-transform:uppercase;font-size:14px}
.mt-t em{display:block;font-style:normal;font-size:12px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{background:linear-gradient(135deg,#ae97f2,#f2a1c4);color:#000;border-radius:10px;padding:2px 9px;font-weight:700;font-size:13px}
.mt-b{display:flex;gap:4px}
.mt-b button,.mt-item button{width:30px;height:30px;border-radius:50%;border:1px solid #333;background:none;color:#fff;font:inherit;cursor:pointer}
.mt-b button:hover:not(:disabled),.mt-item button:hover{background:#fff;color:#000}.mt-b button:disabled{opacity:.25;cursor:default}
.mt-empty{color:var(--mut);text-align:center;padding:26px 10px;margin:0}
.mt-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.mt-item+.mt-item{margin-top:0}
@media (max-width:860px){.mt{grid-template-columns:1fr}}
.cds{display:grid;grid-template-columns:minmax(0,520px);gap:12px;margin:18px 0 6px}
.cd{border:1px solid var(--line);border-radius:20px;padding:14px 18px;background:linear-gradient(160deg,#15111f,#050505)}
.cd span{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#f2a1c4}
.cd em{display:block;font-style:normal;font-size:12px;color:var(--mut);margin:2px 0 8px}
.cd b{font-size:clamp(20px,3.2vw,30px);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cd small{font-size:12px;color:var(--mut);margin-left:1px;font-weight:600}
.live{color:#ff4d4d;animation:live 1.2s ease-in-out infinite}
.rh{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;border:1px solid var(--line);border-radius:28px;padding:26px 30px;background:radial-gradient(circle at 12% 20%,rgba(242,161,196,.22),transparent 55%),#070707}
.rh .big{font-size:clamp(70px,16vw,150px);font-weight:700;line-height:.9;letter-spacing:-.04em;background:linear-gradient(135deg,#fff,#f2a1c4 55%,#ae97f2);-webkit-background-clip:text;background-clip:text;color:transparent}
.rh h3{margin:0 0 6px;font-size:clamp(18px,2.6vw,26px)}.rh p{margin:0;color:#cfcfcf;max-width:52ch}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:6px}
.rd{border:1px solid var(--line);border-radius:22px;padding:18px;background:linear-gradient(160deg,#141414,#050505);display:flex;flex-direction:column;gap:3px;animation:up .5s both}

function hero(){var w=W[4];
return '<section class="feat"><div><span class="tag">VEL 2031 WINNER</span><h2>Yuval Raphael: “PAPA” brought VEL home</h2>'+
'<p>Yuval Raphael won VEL 2031 with “PAPA”, scoring 563 points in the final. As is VEL tradition, the contest moves to the country of the previous winner, so VEL 2032 comes to her home country.</p>'+
'<p>Three nights in Jerusalem, 3, 5 and 7 November 2032: the sixth contest in the history of VEL.</p>'+
'<a class="pill" href="#/winners" style="height:auto;padding:10px 20px">See all winners</a></div>'+photo(w,"YR"," wide")+'</section>'}
function home(){
return hero()+cdHtml()+'<h2>Participating countries of VEL 2032</h2><ul class="pills">'+C.map(function(c){return pill(c)}).join("")+'</ul>'+
news()+runOrder()+'<h2>Past participants not competing in 2032</h2><ul class="pills">'+P.map(function(c){return pill(c)}).join("")+'</ul>'+organizer()}
function winners(){
var cards=W.slice().reverse().map(function(w){
return '<article class="win">'+photo(w,initials(w.a))+'<p class="yr">'+w.y+'</p><h3>'+esc(w.a)+'</h3><p class="song">“'+esc(w.s)+'”</p>'+(w.host?'<p class="song" style="margin:-4px 0 8px;font-size:12px;color:var(--mut)">Hosted in '+esc(w.host)+'</p>':'')+
'<a class="meta" href="#/country/'+slug(w.c)+'"><span>'+flag(code(w.c))+' '+esc(w.c)+'</span><span>'+w.p+' pts</span></a></article>'}).join("");
var next='<article class="win tbd"><div class="ph"><div>? ? ?<small>2032</small></div></div><p class="yr">2032</p><h3>? ? ?</h3><p class="song">Coming soon, we’ll find out very soon!</p></article>';
return '<div class="winners">'+cards+'</div>'}
function country(s){build();
var c=ALL.filter(function(x){return slug(x[0])===s})[0];
if(!c)return '<p class="empty">This country is not on the list.</p><a class="back" href="#/">All countries</a>';
var past=P.indexOf(c)>-1,h=H[s]||{};
var rows=SEASONS.slice().reverse().map(function(y){var r=h[y];
return r?'<tr><td>'+y+'</td><td>'+(r.n?ord(r.n)+' place · '+r.pts+' pts':ord((((DB[c[0]]||{})[y])||{}).o||r.sr)+' place · Out in SF'+r.sf+' · '+r.pts+' pts')+'</td><td>'+esc(r.artist)+' – “'+esc(r.song)+'”</td></tr>':'<tr><td>'+y+'</td><td class="e">—</td><td class="e">'+(YD[y]?'Did not take part':'Results coming soon')+'</td></tr>'}).join("");
var now=past?'<td class="e">—</td><td class="e">Not competing in 2032</td>':
'<td class="e">3.5.7 Nov</td><td>'+(c[2]?esc(c[2])+' – “'+esc(c[3])+'”':'Competing in Jerusalem · artist to be announced')+'</td>';
return '<a class="back" href="#/">All countries</a><div class="ch">'+fl(c[1])+'<h1>'+esc(c[0])+'</h1></div>'+
'<h2>Participation history</h2>'+about(s,h,c[0])+
'<h2>Results by season</h2><div class="scroll"><table class="tbl"><thead><tr><th>Season</th><th>Place</th><th>Song and Artist</th></tr></thead><tbody><tr class="now"><td>2032</td>'+now+'</tr>'+rows+'</tbody></table></div>'}
function render(){mergeH();clearInterval(CDT);cancelAnimationFrame(RACEF);RACEF=0;if(NU){NU();NU=null}
var h=location.hash.replace(/^#\/?/,""),app=document.getElementById("app"),t="VEL SONG CONTEST 2032";
if(h==="odds"){SORT="odds";app.innerHTML=odds();t="Odds · "+t}
else if(h==="records"){app.innerHTML=records();initRecords();t="Records · "+t}
else if(h==="predict"){app.innerHTML=predict();initPred();t="Predict · "+t}
else if(h==="mytop"){app.innerHTML=mytop();initMyTop();t="My Top · "+t}
else if(h==="vote"){app.innerHTML=vote();initVote();t="Vote · "+t}
else if(h==="results"){app.innerHTML=results();initRes();t="2031 Results · "+t}
else if(h==="compare"){app.innerHTML=compare();initCompare();t="Compare · "+t}
else if(h==="winners"){app.innerHTML='<h2>VEL winners</h2>'+rkWinners();t="Winners · "+t}
else if(h.indexOf("country/")===0){var s=decodeURIComponent(h.slice(8));app.innerHTML=country(s);var c=ALL.filter(function(x){return slug(x[0])===s})[0];if(c)t=c[0]+" · "+t}
else{app.innerHTML=home();CDT=setInterval(cdTick,1000)}
document.title=t;
document.getElementById("n-home").setAttribute("aria-current",(h===""||h.indexOf("country/")===0)?"page":"false");
document.getElementById("n-win").setAttribute("aria-current",h==="winners"?"page":"false");
document.getElementById("n-cmp").setAttribute("aria-current",h==="compare"?"page":"false");
document.getElementById("n-rec").setAttribute("aria-current",h==="records"?"page":"false");
document.getElementById("n-pred").setAttribute("aria-current",h==="predict"?"page":"false");
document.getElementById("n-mt").setAttribute("aria-current",h==="mytop"?"page":"false");
document.getElementById("n-vote").setAttribute("aria-current",h==="vote"?"page":"false");
document.getElementById("n-res").setAttribute("aria-current",h==="results"?"page":"false");
document.getElementById("n-odds").setAttribute("aria-current",h==="odds"?"page":"false");
window.scrollTo(0,0)}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
